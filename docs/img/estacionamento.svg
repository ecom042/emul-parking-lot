<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Cenário do estacionamento: visão geral e vista lateral de uma faixa</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <g id="num">
      <circle r="12" fill="#1f5fa8"/>
    </g>
  </defs>
  <rect width="1100" height="800" fill="#ffffff"/>

  <!-- ============ Visão geral (de cima) ============ -->
  <text x="20" y="28" font-size="18" font-weight="bold">A. Visão geral (de cima)</text>

  <!-- pista de entrada -->
  <rect x="30" y="150" width="290" height="60" fill="#d9d9d9"/>
  <line x1="50" y1="180" x2="270" y2="180" stroke="#fff" stroke-width="3" stroke-dasharray="14 10"/>
  <line x1="60" y1="235" x2="250" y2="235" stroke="#333" stroke-width="2" marker-end="url(#seta)"/>
  <text x="40" y="140" font-weight="bold">Faixa de entrada</text>
  <text x="40" y="258" font-size="12">câmera USART3 · ADC4 canal 17</text>
  <rect x="296" y="146" width="10" height="68" fill="#c0392b"/>
  <text x="270" y="140" font-size="12">cancela</text>

  <!-- pátio -->
  <rect x="320" y="45" width="460" height="215" fill="#f4f4f4" stroke="#888" stroke-width="2"/>
  <text x="335" y="66" font-size="13" fill="#555">Pátio: até CONFIG_PARKING_CAPACITY carros (padrão 4)</text>
  <g fill="none" stroke="#888" stroke-width="2">
    <rect x="345" y="80" width="60" height="55"/>
    <rect x="415" y="80" width="60" height="55"/>
    <rect x="625" y="80" width="60" height="55"/>
    <rect x="695" y="80" width="60" height="55"/>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="375" y="112">vaga 1</text><text x="445" y="112">vaga 2</text>
    <text x="655" y="112">vaga 3</text><text x="725" y="112">vaga 4</text>
  </g>
  <rect x="480" y="160" width="140" height="64" rx="6" fill="#1f5fa8"/>
  <text x="550" y="185" fill="#fff" text-anchor="middle" font-weight="bold">nucleo_u5a5zj_q</text>
  <text x="550" y="204" fill="#fff" text-anchor="middle" font-size="12">o seu firmware</text>
  <text x="550" y="218" fill="#fff" text-anchor="middle" font-size="11">(Zephyr, simulado no Renode)</text>
  <line x1="480" y1="192" x2="312" y2="180" stroke="#1f5fa8" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="620" y1="192" x2="790" y2="180" stroke="#1f5fa8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="550" y="246" text-anchor="middle" font-size="12" fill="#1f5fa8">GPIO · EXTI · ADC4 · UART · SPI</text>

  <!-- pista de saída -->
  <rect x="780" y="150" width="290" height="60" fill="#d9d9d9"/>
  <line x1="830" y1="180" x2="1050" y2="180" stroke="#fff" stroke-width="3" stroke-dasharray="14 10"/>
  <line x1="840" y1="235" x2="1040" y2="235" stroke="#333" stroke-width="2" marker-end="url(#seta)"/>
  <rect x="794" y="146" width="10" height="68" fill="#c0392b"/>
  <text x="780" y="140" font-size="12">cancela</text>
  <text x="830" y="140" font-weight="bold">Faixa de saída</text>
  <text x="840" y="258" font-size="12">câmera USART2 · ADC4 canal 18</text>
  <text x="840" y="274" font-size="12">+ terminal LPUART1 e display SPI1</text>
  <rect x="1020" y="84" width="40" height="50" rx="3" fill="#444"/>
  <rect x="1026" y="90" width="28" height="18" fill="#7fd1ff"/>
  <text x="1012" y="104" font-size="12" text-anchor="end">terminal de pagamento</text>
  <text x="1012" y="120" font-size="12" text-anchor="end">com display</text>

  <line x1="20" y1="295" x2="1080" y2="295" stroke="#ccc" stroke-width="1"/>

  <!-- ============ Vista lateral ============ -->
  <text x="20" y="325" font-size="18" font-weight="bold">B. Uma faixa vista de lado (a de saída; a de entrada é igual, sem 9 e 10)</text>

  <!-- chão -->
  <rect x="20" y="600" width="1060" height="8" fill="#888"/>

  <!-- ④ semáforo e ⑤ buzzer, poste à esquerda -->
  <rect x="196" y="420" width="8" height="180" fill="#666"/>
  <rect x="180" y="360" width="40" height="72" rx="6" fill="#222"/>
  <circle cx="200" cy="380" r="12" fill="#e74c3c"/>
  <circle cx="200" cy="412" r="12" fill="#2a6a2a"/>
  <rect x="226" y="372" width="22" height="22" rx="3" fill="#555"/>
  <path d="M252,377 q6,6 0,12 M258,372 q11,11 0,22" fill="none" stroke="#555" stroke-width="2"/>

  <!-- ① cancela: poste, motor, braço fechado e aberto -->
  <rect x="300" y="470" width="26" height="130" fill="#777"/>
  <rect x="290" y="452" width="46" height="36" rx="4" fill="#444"/>
  <text x="313" y="475" fill="#fff" text-anchor="middle" font-size="11">M</text>
  <rect x="326" y="463" width="214" height="14" fill="#c0392b"/>
  <g fill="#fff"><rect x="360" y="463" width="22" height="14"/><rect x="420" y="463" width="22" height="14"/><rect x="480" y="463" width="22" height="14"/></g>
  <rect x="306" y="340" width="14" height="112" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M400,470 A87,87 0 0 0 333,390" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#seta)"/>
  <text x="372" y="408" font-size="12" fill="#666">0° → 90°</text>
  <!-- ② fim de curso superior, ③ inferior -->
  <rect x="322" y="436" width="16" height="12" fill="#f1c40f" stroke="#333"/>
  <rect x="336" y="480" width="16" height="12" fill="#f1c40f" stroke="#333"/>

  <!-- ⑥ feixe no plano da cancela -->
  <rect x="350" y="530" width="12" height="70" fill="#555"/>
  <circle cx="356" cy="545" r="9" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
  <path d="M350,539 l12,12 M362,539 l-12,12" stroke="#e74c3c" stroke-width="2"/>

  <!-- ⑦ sensor de distância -->
  <rect x="326" y="562" width="18" height="18" fill="#2c3e50"/>
  <path d="M352,563 q6,8 0,16 M360,559 q9,12 0,24 M368,555 q12,16 0,32" fill="none" stroke="#2c3e50" stroke-width="2"/>

  <!-- ⑨ terminal de pagamento com ⑩ display -->
  <rect x="440" y="492" width="54" height="108" rx="4" fill="#444"/>
  <rect x="446" y="500" width="42" height="34" fill="#7fd1ff"/>
  <text x="467" y="514" font-size="8" text-anchor="middle">ABC1D23</text>
  <text x="467" y="527" font-size="8" text-anchor="middle">BRL 2.00</text>
  <rect x="452" y="544" width="30" height="6" fill="#222"/>

  <!-- ⑧ câmera -->
  <rect x="586" y="340" width="8" height="260" fill="#666"/>
  <g transform="rotate(25 560 352)">
    <rect x="530" y="340" width="56" height="24" rx="4" fill="#333"/>
    <rect x="520" y="345" width="12" height="14" fill="#555"/>
  </g>
  <path d="M528,372 L440,560 M540,376 L500,560" stroke="#7fb3e6" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>

  <!-- carro chegando -->
  <path d="M626,580 L626,540 Q640,522 680,520 L715,492 L815,492 L850,520 L866,525 L866,580 Z" fill="#3b7dd8"/>
  <path d="M722,500 L760,500 L760,520 L692,520 Z M768,500 L810,500 L834,520 L768,520 Z" fill="#cfe5ff"/>
  <circle cx="665" cy="585" r="17" fill="#222"/><circle cx="825" cy="585" r="17" fill="#222"/>
  <rect x="621" y="548" width="10" height="20" fill="#fff" stroke="#333"/>
  <line x1="760" y1="470" x2="660" y2="470" stroke="#333" stroke-width="2" marker-end="url(#seta)"/>
  <text x="680" y="462" font-size="12">velocidade &lt; 0 (aproxima)</text>

  <!-- eixo de distância: 0,1 px/mm, 0 mm em x=326 -->
  <line x1="126" y1="640" x2="926" y2="640" stroke="#333" stroke-width="1.5"/>
  <g stroke="#333" stroke-width="1.5">
    <line x1="126" y1="634" x2="126" y2="646"/><line x1="326" y1="630" x2="326" y2="650"/>
    <line x1="426" y1="634" x2="426" y2="646"/><line x1="476" y1="634" x2="476" y2="646"/>
    <line x1="626" y1="634" x2="626" y2="646"/><line x1="926" y1="634" x2="926" y2="646"/>
  </g>
  <rect x="326" y="637" width="100" height="6" fill="#27ae60" opacity="0.7"/>
  <rect x="476" y="637" width="450" height="6" fill="#e67e22" opacity="0.5"/>
  <g font-size="12" text-anchor="middle">
    <text x="126" y="664">−2000 mm</text>
    <text x="126" y="679" fill="#555">passou</text>
    <text x="326" y="664" font-weight="bold">0 mm</text>
    <text x="326" y="679" fill="#555">plano da cancela</text>
    <text x="626" y="664">3000 mm</text>
    <text x="626" y="679" fill="#555">código 2047</text>
    <text x="926" y="664">6000 mm</text>
    <text x="926" y="679" fill="#555">código 4095</text>
  </g>
  <line x1="426" y1="646" x2="426" y2="708" stroke="#27ae60" stroke-width="1"/>
  <text x="432" y="704" font-size="12" fill="#1e8449">1000 mm · código &lt; 683: carro presente, inicia a captura</text>
  <line x1="476" y1="646" x2="476" y2="728" stroke="#d35400" stroke-width="1"/>
  <text x="482" y="724" font-size="12" fill="#a04000">1500 mm · código &gt; 1024: carro saiu (abandono, fim da passagem, rearme)</text>
  <text x="126" y="752" font-size="12" fill="#555">Distância = módulo da posição do carro, limitada a 6000 mm · código ADC = distância × 4095 / 6000 (12 bits)</text>

  <!-- números -->
  <g font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">
    <use href="#num" x="268" y="472"/><text x="268" y="477">1</text>
    <use href="#num" x="346" y="420"/><text x="346" y="425">2</text>
    <use href="#num" x="372" y="492"/><text x="372" y="497">3</text>
    <use href="#num" x="160" y="380"/><text x="160" y="385">4</text>
    <use href="#num" x="272" y="383"/><text x="272" y="388">5</text>
    <use href="#num" x="384" y="540"/><text x="384" y="545">6</text>
    <use href="#num" x="312" y="584"/><text x="312" y="589">7</text>
    <use href="#num" x="612" y="388"/><text x="612" y="393">8</text>
    <use href="#num" x="512" y="580"/><text x="512" y="585">9</text>
    <use href="#num" x="512" y="510"/><text x="512" y="515">10</text>
  </g>

  <!-- legenda -->
  <g font-size="12">
    <text x="640" y="350" font-weight="bold">Legenda</text>
    <text x="640" y="368">1 cancela: motor e braço</text>
    <text x="640" y="384">2 fim de curso superior (90°)</text>
    <text x="640" y="400">3 fim de curso inferior (0°)</text>
    <text x="640" y="416">4 sinal vermelho / verde</text>
    <text x="640" y="432">5 buzzer</text>
    <text x="850" y="368">6 feixe de passagem</text>
    <text x="850" y="384">7 sensor de distância (ADC4)</text>
    <text x="850" y="400">8 câmera de placas (UART)</text>
    <text x="850" y="416">9 terminal de pagamento (UART)</text>
    <text x="850" y="432">10 display ST7789V (SPI)</text>
  </g>
</svg>
