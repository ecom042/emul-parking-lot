CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y
CONFIG_PM=n
# UARTs dos equipamentos por interrupção, com buffer de recepção próprio.
# O ring_buf "slim" do Zephyr 4.5 já está sempre disponível; CONFIG_RING_BUFFER
# só restauraria a API legada (e marca DEPRECATED, que a análise estática conta).
CONFIG_UART_INTERRUPT_DRIVEN=y
