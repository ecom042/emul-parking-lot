CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y
CONFIG_PM=n
# Programming errors (e.g. an invalid lane id) halt with a message instead of
# touching a random pin.
CONFIG_ASSERT=y
# zbus: the distance channel (services/distance.h) is part of the contract.
CONFIG_ZBUS=y
