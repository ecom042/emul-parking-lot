CONFIG_ZTEST=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_PM=n
CONFIG_GPIO=y
# Emulated UART and ADC (app.overlay) for hw/uart_line and hw/adc4.
CONFIG_EMUL=y
CONFIG_UART_EMUL=y
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y
CONFIG_ADC_EMUL=y
# hw/st7789 runs on the board's real SPI and display model.
CONFIG_SPI=y
