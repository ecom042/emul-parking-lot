# West topology 2: this repository is the manifest repository. In a new
# folder, `west init -l emul-parking-lot` and `west update --narrow` place
# Zephyr, its STM32 HAL and CMSIS, and zephyr-virtual-board beside it.
manifest:
  version: "1.2"
  projects:
    - name: zephyr
      url: https://github.com/zephyrproject-rtos/zephyr.git
      # Zephyr v4.5.0, peeled release commit.
      revision: 41d10b59730406bbab4ca9f1fbbe9e96aafb4966
      path: zephyr
      import:
        name-allowlist:
          - cmsis_6
          - hal_stm32
    - name: zephyr-virtual-board
      url: https://github.com/rodrigopex/zephyr-virtual-board.git
      revision: aed53b3cedad1e93d6a92837ce79d8cd7198d2af
      path: zephyr-virtual-board
      west-commands: scripts/west-commands.yml
  self:
    path: emul-parking-lot
